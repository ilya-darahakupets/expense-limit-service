spring:
  application:
    name: expense-limit-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:expense_limit}
    username: ${DB_USER:expense}
    password: ${DB_PASSWORD:expense}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
  mvc:
    problemdetails:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  zone-id: UTC
  default-limit-usd: 1000.00
