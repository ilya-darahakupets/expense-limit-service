services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: expense_limit
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: expense
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense -d expense_limit"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - expense_limit_pg:/var/lib/postgresql/data

volumes:
  expense_limit_pg:
